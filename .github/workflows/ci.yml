name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find . -name "*.php" | while read f; do
            php -l "$f" || exit 1
          done
